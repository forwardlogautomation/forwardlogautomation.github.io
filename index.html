<style>:root{--brand:#5F7A61;--brand-dk:#475C4A;--brand-lt:#E9F0E9;--brand-ink:#fff;--bg:#F3F5F2;--card:#fff;--ink:#262A27;--grey:#6B6B6B;--muted:#7A807B;--line:#E2E7E2;--ok:#2E7D4F;--ok-bg:#E2F3E8;--bad:#C0392B;--bad-bg:#FBE4E1;--warn:#B7791F;--warn-bg:#FDF1DC;--info:#2A5D9F;--info-bg:#E7F1FB;--radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(40,60,45,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--brand);padding:8px 12px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
header.top .logo{height:58px;width:auto;margin:-4px auto -4px 0;display:block;min-width:60px}
header.top .logo[src=""]{visibility:hidden}
header.top .htitle{order:3;flex:1 0 100%;display:flex;align-items:baseline;gap:8px;padding:5px 2px 0;border-top:1px solid var(--line)}
header.top .app{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--brand);text-transform:uppercase}
header.top h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
header.top .hlink{font-size:13px;font-weight:700;color:var(--brand-dk);text-decoration:none;padding:4px 2px}
header.top button{background:var(--brand-lt);color:var(--brand-dk);border:0;border-radius:10px;padding:7px 11px;font-weight:700;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
#acct{display:flex;align-items:center;gap:8px}
#acct .av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
#acct .who{line-height:1.15;text-align:right}#acct .who b{display:block;font-size:12.5px}#acct .who span{display:block;font-size:11px;color:var(--muted)} #acct button{margin-left:2px} header.top .htitle{min-height:33px;box-sizing:border-box} header.top .htitle .app{line-height:14.5px} header.top .htitle h1{line-height:21.75px} header.top .htitle .hlink{align-self:center} #n_client,#n_solution,#f_client,#f_solution{text-transform:uppercase} .solpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 6px} .solbox{display:flex;align-items:center;gap:8px;margin:0;padding:9px 10px;border:1.5px solid #CBD3CB;border-radius:11px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;background:#fff} .solbox input{width:auto;margin:0;padding:0;accent-color:var(--brand)} .solbox:has(input:checked){border-color:var(--brand);background:var(--brand-lt)} .solother{text-transform:uppercase} @media (max-width:560px){header.top .logo{height:46px;margin:-2px auto -2px 0}}
@media (max-width:640px){#acct .who{display:none}}
main{max-width:900px;margin:0 auto;padding:14px 12px 120px}
footer.tag{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.4px;padding:4px 0 22px}footer.tag b{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.8px;color:var(--grey);font-weight:700}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #CBD3CB;border-radius:11px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(95,122,97,.22)}
input[type=checkbox],input[type=radio]{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:12px 16px;min-height:44px;font:inherit;font-size:15px;font-weight:700;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.97);filter:brightness(.93)}.btn.sec{background:#EDF1ED;color:var(--ink)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sm{padding:8px 12px;font-size:13px;min-height:36px}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1 1 150px}.muted{color:var(--muted);font-size:12.5px}.hidden{display:none!important}
.chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:999px;background:#ECEFEC;color:#4B524C;text-transform:uppercase;white-space:nowrap}

  if (isPct(unit)) return (+(v * 100).toFixed(6)).toLocaleString('en-US') + ' %';
  var dp = Number.isInteger(v) ? 0 : (exact ? 3 : 2);
  return v.toLocaleString('en-US', { maximumFractionDigits: dp, minimumFractionDigits: 0 });
}
function unitTxt(u) { return u && u !== '%' && u !== 'text' ? ' <span class="u">' + esc(u) + '</span>' : ''; }

/* ---- logo (served by the API, cached) ---- */
function loadLogo() {
  function set(u) { $$('img.logo, #wall img').forEach(function (i) { i.src = u; }); }
  var c = ['fl_logo', 'slc_logo', 'pp_logo', 'sc_logo'].map(function (k) { var v = ls(k); if (v && v.charAt(0) === '"') { try { v = JSON.parse(v); } catch (e) { } } return v; })
    .filter(function (v) { return v && v.indexOf('data:image') === 0; })[0];
  if (c) set(c);
  fetch(LOGO_URL, { method: 'POST', body: JSON.stringify({ fn: 'getLogo', args: [] }), redirect: 'follow', credentials: 'omit' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.ok && j.result) { if (j.result !== c) ls('fl_logo', j.result); set(j.result); } })
    .catch(function () { });
}
var _auth = null, _gsi = null, _waiters = [], _renew = null;
function readAuth() {
  try { var a = JSON.parse(ls(K + 'auth') || 'null'); if (a && a.token && a.exp - Date.now() > 60000) return a; } catch (e) { }
  return null;
}
function lastEmail() { try { return (JSON.parse(ls(K + 'auth') || 'null') || {}).email || ''; } catch (e) { return ''; } }
function loadGsi() {
  if (_gsi) return _gsi;
  _gsi = new Promise(function (res, rej) {
    if (window.google && google.accounts && google.accounts.id) return res();
    var s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = function () { res(); }; s.onerror = function () { _gsi = null; rej(new Error('Could not load Google sign-in')); };
    document.head.appendChild(s);
  }).then(function () {
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true, hd: HD, use_fedcm_for_prompt: true });
  });
  return _gsi;
}
function decodeJwt(t) {
  var p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(atob(p + '==='.slice((p.length + 3) % 4)))));
}
function onCredential(resp) {
  try {
    var p = decodeJwt(resp.credential);
    if (p.hd !== HD) { toast('Please sign in with your @' + HD + ' account', true); return; }
    var prev = lastEmail();
    _auth = { token: resp.credential, exp: p.exp * 1000, name: p.name || p.email, email: p.email };
    ls(K + 'auth', JSON.stringify(_auth));
    if (prev && prev !== p.email) clearCaches();
    var w = $('#wall'); if (w) w.remove();
    scheduleRenew(); renderChip();
    var q = _waiters; _waiters = []; q.forEach(function (f) { f(_auth); });
  } catch (e) { toast('Sign-in failed. Try again.', true); }
}
function scheduleRenew() {
  clearTimeout(_renew);
  var ms = Math.max(15000, _auth.exp - Date.now() - 5 * 60000);
  _renew = setTimeout(function () { loadGsi().then(function () { google.accounts.id.prompt(); }).catch(function () { }); }, ms);
}
function showWall() {
  if ($('#wall')) return;
  var d = document.createElement('div'); d.id = 'wall';
  d.innerHTML = '<div class="box"><img alt="Forwardlog" src="' + esc(ls(K + 'logo') || '') + '"><h2>' + APP_TITLE + '</h2><p>Sign in with your @' + HD + ' Google account to continue.</p><div id="gbtn"></div><p id="wallerr" class="muted" style="margin:12px 0 0"></p></div>';
  document.body.appendChild(d);
  if (window.FL_LOADER_API) FL_LOADER_API.hideSplash();
  loadGsi().then(function () {
    google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 260 });
    google.accounts.id.prompt();
  }).catch(function (e) { $('#wallerr').textContent = e.message + '. Check your connection and reload.'; });
}
/* quiet=true: someone signed in here before, so try a silent sign-in first and only show the wall if it does not come back quickly */
function requireLogin(quiet) {
  _auth = readAuth();
  if (_auth) { scheduleRenew(); renderChip(); return Promise.resolve(_auth); }
  return new Promise(function (res) {
    _waiters.push(res);
    if (quiet) {
      loadGsi().then(function () { google.accounts.id.prompt(); }).catch(function () { });
      setTimeout(function () { if (!_auth) showWall(); }, 2500);
    } else showWall();
  });
}
function clearCaches() { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(K + 'c_') === 0) ls(k, null); }); }
function signOut() {
  if (!confirm('Sign out of ' + APP_TITLE + '?')) return;
  ls(K + 'auth', null); clearCaches(); _auth = null;
  loadGsi().then(function () { google.accounts.id.disableAutoSelect(); }).catch(function () { }).then(function () { location.reload(); });
}
function renderChip() {
  var a = $('#acct'); if (!a || !_auth) return;
  var ini = (_auth.name || '?').split(/\s+/).map(function (x) { return x[0]; }).join('').slice(0, 2).toUpperCase();
  a.innerHTML = '<span id="sync" class="sync hidden"></span><div class="av">' + esc(ini) + '</div><div class="who"><b>' + esc(_auth.name) + '</b><span>' + esc(_auth.email) + '</span></div><button id="so" type="button">Sign out</button>';
  $('#so').onclick = signOut; syncPill();
}

/* ---- API ---- */
function api(fn, args) {
  var a = _auth || readAuth();
  if (!a) { _auth = null; return requireLogin().then(function () { return api(fn, args); }); }
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args || [], token: a.token }), redirect: 'follow', credentials: 'omit' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.ok) return j.result;
      if (j.error === 'LOGIN_REQUIRED') { ls(K + 'auth', null); _auth = null; return requireLogin().then(function () { return api(fn, args); }); }
      var e = new Error(j.error || 'Request failed'); e.server = true; throw e;
    });
}
function fail(e) { toast((e && e.message) || 'Something went wrong', true); }

/* ---- saved data shown at start-up (keyed to the signed-in email) ---- */
function cacheGet(name) {
  try { var c = JSON.parse(ls(K + 'c_' + name) || 'null'); var em = (_auth && _auth.email) || lastEmail(); return c && c.email === em ? c.data : null; } catch (e) { return null; }
}
function cacheSet(name, data) {
  try { var em = (_auth && _auth.email) || lastEmail(), s = JSON.stringify({ email: em, at: Date.now(), data: data }); if (s.length < 3.5e6) ls(K + 'c_' + name, s); } catch (e) { }
}
/* reference data (constants + specs), shared by every page */
function refData() { return cacheGet('ref'); }
function setRefData(d) { if (d && d.constants) cacheSet('ref', { constants: d.constants, specs: d.specs }); }

/* ---- offline queue for saving estimates (server de-duplicates by opId) ---- */
function queue() { try { return JSON.parse(ls(K + 'queue') || '[]'); } catch (e) { return []; } }
function setQueue(q) { ls(K + 'queue', JSON.stringify(q)); syncPill(); }
function queueAdd(op) { var q = queue(); q.push(op); setQueue(q); }
function syncPill() {
  var el = $('#sync'); if (!el) return; var n = queue().length;
  el.classList.toggle('hidden', !n); el.textContent = n + ' pending'; el.title = n + ' estimate(s) waiting to be sent';
}
var _flushing = null;
function flushQueue() {
  if (_flushing) return _flushing;
  _flushing = (function next(sent) {
    var q = queue(); if (!q.length) return Promise.resolve(sent);
    var op = q[0];
    return api(op.fn, op.args).then(function (res) {
      setQueue(queue().filter(function (x) { return x.opId !== op.opId; }));
      if (op.onDone) try { window[op.onDone] && window[op.onDone](res); } catch (e) { }
      return next(sent.concat([res]));
    }, function (e) {
      if (e && e.server) {                                     // the server refused it: drop it and say why
        setQueue(queue().filter(function (x) { return x.opId !== op.opId; }));
        toast('Could not save "' + ((op.args[0] || {}).title || 'estimate') + '": ' + e.message, true);
        return next(sent);
      }
      return sent;                                             // offline: keep it for later
    });
  })([]).then(function (s) { _flushing = null; return s; }, function () { _flushing = null; return []; });
  return _flushing;
}
window.addEventListener('online', function () { if (queue().length) flushQueue(); });

/* ---- page start: logo, sign-in, then the page ---- */
function startPage(run) {
  loadLogo();
  var lg = $('#logoHome');
  if (lg && !lg.dataset.custom) lg.addEventListener('click', function (e) { if (window.goHome) { e.preventDefault(); goHome(); window.scrollTo(0, 0); } });
  var had = !!lastEmail();
  // saved data on screen: keep the logo splash up for a short moment (the same opening as the other portals), then show the page
  // while fresh data loads under the green top bar. With nothing saved, the loader drops the splash when the first reply arrives.
  var SPLASH_MIN = 1100;
  function reveal() {
    var m = $('#main'); if (!(m && m.textContent.trim() !== 'Loading…' && window.FL_LOADER_API)) return;
    setTimeout(FL_LOADER_API.hideSplash, Math.max(0, SPLASH_MIN - (window.performance ? performance.now() : 0)));
  }
  if (had && !readAuth()) { run(true); reveal(); }             // show saved data while a quiet sign-in runs
  requireLogin(had).then(function () { syncPill(); run(false); reveal(); if (queue().length) flushQueue(); });
}
function showAdminLink(me) { var a = $('#adminlink'); if (a && me && me.admin) a.classList.remove('hidden'); }
/* in-page ← : go back if we came from this portal, otherwise open the parent page */
function goBack(parentUrl) {
  var ref = document.referrer || '';
  if (ref.indexOf(location.origin + location.pathname.replace(/[^\/]*$/, '')) === 0 && history.length > 1) history.back();
  else location.href = parentUrl;
}
function openSheet(html, onClose) {
  var o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  function close() { o.remove(); document.removeEventListener('keydown', key); if (onClose) onClose(); }
  function key(e) { if (e.key === 'Escape') close(); }
  o.addEventListener('mousedown', function (e) { if (e.target === o) close(); });
  document.addEventListener('keydown', key);
  document.body.appendChild(o);
  var f = o.querySelector('input,select,textarea'); if (f && matchMedia('(min-width:641px)').matches) f.focus();
  o.close = close;
  return o;
}

/* ---- solutions ---- */
function sol(code) { return SC.solution(code); }
function statusChip(st) {
  var c = { Open: 'brand', Quoted: 'info', Won: 'ok', Lost: 'bad', 'On hold': 'warn', Archived: '' }[st] || '';
  return '<span class="chip ' + c + '">' + esc(st || 'Open') + '</span>';
}
function keyResultTxt(code, val) {
  var s = sol(code); if (!s) return '';
  return '<b>' + fmtNum(val) + '</b> ' + esc(s.keyLabel.toLowerCase());
}
function projectForm(p, statuses) {
  p = p || {};
  return '<label for="pf_name">Project name *</label><input id="pf_name" maxlength="120" value="' + esc(p.name) + '" required>' +
    '<div class="row"><div><label for="pf_client">Client</label><input id="pf_client" maxlength="120" value="' + esc(p.client) + '"></div>' +
    '<div><label for="pf_site">Site</label><input id="pf_site" maxlength="120" value="' + esc(p.site) + '"></div></div>' +
    '<div class="row"><div><label for="pf_pm">PM / presales</label><input id="pf_pm" maxlength="80" value="' + esc(p.pm) + '"></div>' +
    '<div><label for="pf_status">Status</label><select id="pf_status">' + (statuses || ['Open']).map(function (s) { return '<option' + (s === (p.status || 'Open') ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div></div>';
}
function readProjectForm(o, id) {
  return { projectId: id || '', name: $('#pf_name', o).value.trim(), client: $('#pf_client', o).value.trim(), site: $('#pf_site', o).value.trim(), pm: $('#pf_pm', o).value.trim(), status: $('#pf_status', o).value };
}

/* AIRROB sales summary: allowable totes first, total cells beside it, then the rack layout as a small table */
function isAirrob(code) { return /^airrob/.test(code || ''); }
function airrobSummary(v, title) {
  var n = function (x) { return fmtNum(x).replace(/<[^>]+>/g, ''); };
  var pct = v.maxTotes ? Math.round(v.allowTotes / v.maxTotes * 100) : 0;
  var row = function (label, totes, groups) { return '<tr><td>' + label + '</td><td>' + n(v.levels) + '</td><td>' + n(totes) + '</td><td>' + n(groups) + '</td></tr>'; };
  return '<h2>' + esc(title || 'AIRROB') + '</h2>' +
    '<div class="big"><div class="k main"><b>' + n(v.allowTotes) + '</b><span>Allowable totes for AIRROB</span></div>' +
    '<div class="k"><b>' + n(v.maxTotes) + '</b><span>Total cells for AIRROB' + (pct ? ' · ' + pct + '% usable' : '') + '</span></div></div>' +
    '<table class="asum"><thead><tr><th>Rack layout</th><th>Levels</th><th>Totes per group</th><th>Groups</th></tr></thead><tbody>' +
    row('Single-layer', v.totesSingleBay, v.singleBays) + row('Double-layer', v.totesDoubleBay, v.doubleBays) + '</tbody></table>';
}

</script>
<script>
/* The portals this person can open (control centre: myPortals). Names and one-line purposes live here;
   who can open what, the link and the health come from the control centre. */
var INFO = {
  presales: { name: 'Presales Pipeline', desc: 'Presales projects from first lead to handover: stages, updates and next steps.' },
  progress: { name: 'Progress Reports', desc: 'Project milestones, site updates with photos, and printable status reports.' },
  'solution-calc': { name: 'Solution Calc', desc: 'AIRROB, 4WS, APR and wheel sorter estimates, saved per project.' },
  sortcheck: { name: 'SortCheck', desc: 'Check sorting results against orders, wave by wave, with reports to Drive.' }
};
var ORDER = ['presales', 'progress', 'solution-calc', 'sortcheck'];
var S = { d: null };
function titleOf(k) { return (INFO[k] && INFO[k].name) || k.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
function healthTxt(h) {
  if (!h || h.ok === null || h.ok === undefined) return '<span class="dot"></span>Status not checked';
  return '<span class="dot ' + (h.ok ? 'ok' : 'bad') + '"></span>' + (h.ok ? 'Up' : 'Down') + (h.checkedAt ? ' · checked ' + esc(ago(h.checkedAt)) : '');
}
function render() {
  var d = S.d; if (!d) return;
  var first = (_auth && _auth.name ? _auth.name : userName(d.email)).split(' ')[0];
  var list = d.portals.slice().sort(function (a, b) { var i = ORDER.indexOf(a.key), j = ORDER.indexOf(b.key); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); });
  var h = '<div class="tb"><span class="bar"></span><div><div class="eb">Forwardlog Automation</div><h1>Portals</h1><p>Hi ' + esc(first) + ', pick a portal. You see the ones you have access to.</p></div></div>';
  if (!list.length) h += '<div class="empty">You don\'t have access to any portal yet. Ask an admin to add you in Settings.</div>';
  else h += '<div class="tiles">' + list.map(function (p) {
    var i = INFO[p.key] || {};
    return '<a class="tile" href="' + esc(p.url || ('/' + p.key + '/')) + '"><div class="tn">' + esc(titleOf(p.key)) + (p.admin ? '<span class="role">Admin</span>' : '') + '</div>' +
      '<div class="td">' + esc(i.desc || '') + '</div><div class="tf"><span>' + healthTxt(p.health) + '</span><span class="go">Open →</span></div></a>';
  }).join('') + '</div>';
  if (d.admin) h += '<div class="side"><div><b>Settings</b><span>Who can open each portal, admins, health checks and shortcuts. Only admins see this.</span></div><a class="btn" href="settings.html">Open settings</a></div>';
  $('#main').innerHTML = h;
}
function run(cachedOnly) {
  var c = cacheGet('portals'); if (c && !S.d) { S.d = c; render(); }
  if (cachedOnly) return;
  return api('myPortals', []).then(function (d) { cacheSet('portals', d); S.d = d; render(); })
    .catch(function (e) { if (!S.d) $('#main').innerHTML = '<div class="empty">Could not load the portals: ' + esc(e.message) + '</div>'; else fail(e); });
}
startPage(run);
</script>
