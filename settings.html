      return '<div class="setrow" data-p="' + esc(s.portal) + '" data-k="' + esc(s.key) + '"><div class="pmain"><b>' + esc(s.key) + '</b><div class="val">' + esc(s.value) + '</div>' + (s.note ? '<div class="muted xs">' + esc(s.note) + '</div>' : '') + '<div class="muted xs">Updated ' + esc(ago(s.updated)) + (s.updatedBy ? ' by ' + esc(s.updatedBy) : '') + '</div></div><button class="btn sm sec ed">Edit</button></div>';
    }).join('') : '<p class="muted sm">Nothing set. The portal uses its built-in values.</p>') + '</div>';
  });
  $('#pane').innerHTML = h;
  $('#adds').onclick = function () { editSetting(null); };
  $$('.setrow .ed').forEach(function (b) { var r = b.closest('.setrow'); b.onclick = function () { editSetting(A.data.settings.filter(function (s) { return s.portal === r.dataset.p && s.key === r.dataset.k; })[0]); }; });
}
function editSetting(s) {
  var isNew = !s; s = s || { portal: 'presales', key: '', value: '', note: '' };
  var o = openSheet('<h3>' + (isNew ? 'Add setting' : esc(PORTAL_NAME[s.portal] + ' · ' + s.key)) + '</h3>' +
    (isNew ? '<label>Portal</label>' + sel('s_portal', [['all', 'All portals']].concat(A.data.portals.map(function (p) { return [p, PORTAL_NAME[p]]; })), s.portal) +
      '<label>Setting</label>' + sel('s_pick', [['', 'Choose…']].concat(KNOWN_SETTINGS.map(function (k, i) { return ['k' + i, PORTAL_NAME[k[0]] + ' · ' + k[1]]; })).concat([['custom', 'Other (type a name)']]), '') +
      '<input id="s_key" placeholder="settingName" style="margin-top:6px;display:none"><p class="muted xs" id="s_hint" style="margin:6px 0 0"></p>' : '') +
    '<label>Value</label><textarea id="s_value" rows="3">' + esc(s.value) + '</textarea>' +
    '<label>Note (optional)</label><input id="s_note" value="' + esc(s.note) + '">' +
    '<div class="btns">' + (isNew ? '' : '<button class="btn sec bad" id="del">Remove</button>') + '<button class="btn sec" id="cx">Cancel</button><button class="btn" id="go">Save</button></div>');
  if (isNew) $('#s_pick', o).onchange = function () {
    var v = this.value, k = $('#s_key', o);
    if (v === 'custom') { k.style.display = ''; k.value = ''; $('#s_hint', o).textContent = 'Letters, numbers and _ only.'; return; }
    k.style.display = 'none';
    if (!v) { k.value = ''; $('#s_hint', o).textContent = ''; return; }
    var ks = KNOWN_SETTINGS[+v.slice(1)]; k.value = ks[1]; $('#s_portal', o).value = ks[0]; $('#s_hint', o).textContent = ks[2];
  };
  $('#cx', o).onclick = function () { o.close(); };
  if (!isNew) $('#del', o).onclick = function () {
    if (!confirm('Remove ' + s.key + '? The portal goes back to its built-in value.')) return;
    api('deleteSetting', [s.portal, s.key]).then(function () { o.close(); reload('Removed'); }).catch(fail);
  };
  $('#go', o).onclick = function () {
    var rec = { portal: isNew ? $('#s_portal', o).value : s.portal, key: isNew ? $('#s_key', o).value.trim() : s.key, value: $('#s_value', o).value.trim(), note: $('#s_note', o).value };
    if (!rec.key) { toast('Choose a setting', true); return; }
    busy($('#go', o), api('saveSetting', [rec])).then(function () { o.close(); reload('Saved'); }).catch(fail);
  };
}

/* ---------- Health ---------- */
function renderHealth() {
  var d = A.data;
  var h = '<div class="card"><div class="rowhead"><h3>Portal health</h3><button class="btn sm" id="chk">Check now</button></div><p class="muted sm">Each check calls the portal\'s server and records whether it answered and how long it took. It also runs automatically every 30 minutes once the timer is switched on.</p></div>';
  h += d.health.map(function (x) {
    var st = !x.apiUrl ? '<span class="chip">No server link</span>' : !x.checkedAt ? '<span class="chip">Not checked yet</span>' : x.ok ? '<span class="chip ok">Up · ' + esc(x.ms) + ' ms</span>' : '<span class="chip bad">Down</span>';
    return '<div class="card"><div class="rowhead"><h3>' + PORTAL_NAME[x.portal] + '</h3>' + st + '</div><div class="muted xs">Last check: ' + esc(ago(x.checkedAt)) + (x.detail ? ' · ' + esc(x.detail) : '') + '</div><label>Server link (Apps Script web app, ends in /exec)</label><div class="row"><input class="hurl" data-p="' + esc(x.portal) + '" value="' + esc(x.apiUrl) + '" style="flex:1 1 220px"><button class="btn sm sec hs">Save</button></div></div>';
  }).join('');
  $('#pane').innerHTML = h;
  $('#chk').onclick = function () { busy(this, api('checkHealth')).then(function (hl) { A.data.health = hl; renderHealth(); toast('Checked'); }).catch(fail); };
  $$('.hs').forEach(function (b) { b.onclick = function () { var i = b.parentNode.querySelector('.hurl'); busy(b, api('saveHealthUrl', [i.dataset.p, i.value.trim()])).then(function () { reload('Saved'); }).catch(fail); }; });
}

/* ---------- Shortcuts ---------- */
function renderLinks() {
  var d = A.data, groups = d.portals.concat(['other']);
  var h = '<div class="card"><div class="rowhead"><h3>Shortcuts</h3><button class="btn sm" id="addl">+ Add link</button></div></div>';
  groups.forEach(function (g) {
    var rows = d.links.filter(function (l) { return (d.portals.indexOf(l.portal) >= 0 ? l.portal : 'other') === g; });
    if (!rows.length) return;
    h += '<div class="card"><h3>' + (PORTAL_NAME[g] || 'Other') + '</h3>' + rows.map(function (l) {
      return '<div class="lnk" data-r="' + l.row + '"><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a><span class="chip">' + esc(l.kind) + '</span><button class="btn sm sec ed">Edit</button></div>';
    }).join('') + '</div>';
  });
  $('#pane').innerHTML = h;
  $('#addl').onclick = function () { editLink(null); };
  $$('.lnk .ed').forEach(function (b) { b.onclick = function () { var r = +b.closest('.lnk').dataset.r; editLink(A.data.links.filter(function (l) { return l.row === r; })[0]); }; });
}
function editLink(l) {
  var isNew = !l; l = l || { row: 0, portal: 'presales', label: '', url: 'https://', kind: 'site' };
  var o = openSheet('<h3>' + (isNew ? 'Add link' : 'Edit link') + '</h3><label>Portal</label>' + sel('l_portal', A.data.portals.map(function (p) { return [p, PORTAL_NAME[p]]; }).concat([['other', 'Other']]), l.portal) +
    '<label>Label</label><input id="l_label" value="' + esc(l.label) + '"><label>Link</label><input id="l_url" value="' + esc(l.url) + '"><label>Type</label>' + sel('l_kind', [['site', 'Portal'], ['sheet', 'Google Sheet'], ['backend', 'Apps Script'], ['code', 'GitHub'], ['other', 'Other']], l.kind) +
    '<div class="btns">' + (isNew ? '' : '<button class="btn sec bad" id="del">Remove</button>') + '<button class="btn sec" id="cx">Cancel</button><button class="btn" id="go">Save</button></div>');
  $('#cx', o).onclick = function () { o.close(); };
  if (!isNew) $('#del', o).onclick = function () { if (confirm('Remove this link?')) api('deleteLink', [l.row]).then(function () { o.close(); reload('Removed'); }).catch(fail); };
  $('#go', o).onclick = function () {
    busy($('#go', o), api('saveLink', [{ row: l.row, portal: $('#l_portal', o).value, label: $('#l_label', o).value.trim(), url: $('#l_url', o).value.trim(), kind: $('#l_kind', o).value }])).then(function () { o.close(); reload('Saved'); }).catch(fail);
  };
}

/* ---------- Admins & log ---------- */
function renderAdmins() {
  var d = A.data;
  var h = '<div class="card"><div class="rowhead"><h3>Admins</h3><button class="btn sm" id="adda">+ Add admin</button></div><p class="muted sm">Only these accounts can open this Admin portal.</p>' +
    d.admins.map(function (a) { return '<div class="lnk"><span><b>' + esc(a.email) + '</b>' + (a.email === d.me ? ' <span class="chip ok">You</span>' : '') + '<br><span class="muted xs">Added ' + esc(a.added) + (a.addedBy ? ' by ' + esc(a.addedBy) : '') + '</span></span>' + (a.email === d.me ? '' : '<button class="btn sm sec rm" data-e="' + esc(a.email) + '">Remove</button>') + '</div>'; }).join('') + '</div>';
  h += '<div class="card"><h3>Recent changes</h3>' + (d.log.length ? d.log.map(function (x) { return '<div class="logrow"><span class="muted xs">' + esc(x.ts.replace('T', ' ').slice(0, 16)) + ' · ' + esc(x.user) + '</span><div><b>' + esc(x.action) + '</b> ' + esc(x.detail) + '</div></div>'; }).join('') : '<p class="muted sm">No changes yet.</p>') + '</div>';
  $('#pane').innerHTML = h;
  $('#adda').onclick = function () {
    var e = prompt('Email of the new admin (@forwardlogauto.com):'); if (!e) return;
    api('saveAdmin', [e.trim(), '']).then(function () { reload('Admin added'); }).catch(fail);
  };
  $$('.rm').forEach(function (b) { b.onclick = function () { if (confirm('Remove ' + b.dataset.e + ' as admin?')) api('deleteAdmin', [b.dataset.e]).then(function () { reload('Removed'); }).catch(fail); }; });
}

boot();
</script>
